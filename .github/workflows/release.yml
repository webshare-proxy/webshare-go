name: Release

# Go modules are "published" simply by pushing a semver tag — the module proxy
# (proxy.golang.org) and pkg.go.dev index it on first fetch. This workflow gates
# the tag on a green test run, cuts a GitHub Release, and warms the proxy so the
# version is discoverable immediately.
#
# Tag format: v1.2.3  (Go requires the leading v; proxy caches tags immutably —
# a bad tag cannot be recalled, only superseded by a higher version.)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false

      - name: Test
        run: go test -race -count=1 ./...

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Warm the module proxy (indexes on pkg.go.dev)
        env:
          GOPROXY: proxy.golang.org
        run: go list -m "github.com/webshare-proxy/webshare-go@${GITHUB_REF_NAME}"
